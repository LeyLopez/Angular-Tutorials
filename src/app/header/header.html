<nav class="bg-white shadow-lg border-b border-gray-100">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <!-- Logo y Título -->
    <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse group">
      <div class="h-10 w-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-lg flex items-center justify-center group-hover:from-blue-700 group-hover:to-blue-800 transition-all duration-200 shadow-md">
        <svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"/>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-xl font-bold text-gray-900 group-hover:text-blue-700 transition-colors duration-200">
          Unimagdalena
        </span>
        <span class="text-xs text-blue-600 font-medium -mt-1">
          Tutorials
        </span>
      </div>
    </a>

    <!-- Botón hamburguesa -->
    <button
      (click)="toggleNavbar()"
      type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200"
      [attr.aria-controls]="'navbar-default'"
      [attr.aria-expanded]="isMenuOpen"
    >
      <span class="sr-only">Abrir menú principal</span>
      <svg
        class="w-5 h-5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 17 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M1 1h15M1 7h15M1 13h15"
        />
      </svg>
    </button>

    <!-- Menú de navegación -->
    <div [class]="isMenuOpen ? 'w-full md:block md:w-auto' : 'hidden w-full md:block md:w-auto'" id="navbar-default">
      <div class="flex flex-col md:flex-row md:space-x-3 p-4 md:p-0 mt-4 md:mt-0 space-y-3 md:space-y-0">
        <!-- Botón Login -->
        <button
          class="group relative px-5 py-2.5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg transition-all duration-200 transform hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          <span class="flex items-center justify-center">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Iniciar Sesión
          </span>
        </button>

        <!-- Botón Sign Up -->
        <button
          class="group relative px-5 py-2.5 bg-white border-2 border-blue-600 hover:bg-blue-50 text-blue-600 hover:text-blue-700 font-semibold rounded-lg transition-all duration-200 transform hover:-translate-y-0.5 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          <span class="flex items-center justify-center">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
            Registrarse
          </span>
        </button>
      </div>
    </div>
  </div>
</nav>
